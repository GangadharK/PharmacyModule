# Pharmacy Management System - application configuration
#
# Every value is a ${ENV:default} placeholder. No credential is hardcoded.
# The defaults are development conveniences and are not safe for production.
#
# See context/code-standards.md 4 and context/MDD.md 2.
#
# The development profile lives in application-dev.properties. Properties files
# have no multi-document equivalent of YAML's `---` separator, so a profile that
# was a second document here is a separate file there. It is activated the same
# way, with -Dspring-boot.run.profiles=dev.

server.port=${SERVER_PORT:8081}
# The GlobalExceptionHandler produces the ApiError envelope. Letting Spring
# also emit a Whitelabel page means a client can receive two different error
# shapes depending on whether the advice handler or the default resolver ran.
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

spring.application.name=pharmacy

# PostgreSQL, and only PostgreSQL. Decision 22 removed MySQL after
# dual-engine maintenance proved more expensive than it was worth.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pharmacy}
spring.datasource.username=${DB_USERNAME:pharmacy}
spring.datasource.password=${DB_PASSWORD:pharmacy}
spring.datasource.driver-class-name=org.postgresql.Driver
# FEFO reads hold SELECT ... FOR UPDATE row locks for the duration of a
# transaction. A pool that is too small turns that into lock contention
# timeouts under concurrent dispensing. 20 is a floor, not a target.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=pharmacy-cp

# validate, never update. Flyway owns the schema. 'update' silently mutates
# a developer's database and hides migration drift, which is exactly the
# failure mode this project is avoiding.
spring.jpa.hibernate.ddl-auto=validate
# false is correct and load-bearing. With it true, Hibernate holds the
# persistence context and a connection open for the whole HTTP request,
# including serialisation - so a long-running endpoint can exhaust the pool.
# Set to false, a lazy load outside @Transactional fails loudly instead of
# appearing to work by accident.
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# FEFO compares expiry_date against LocalDate.now(). A session timezone
# that drifts shifts that boundary by a day and silently changes which
# batch is dispensed first.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
# false: this schema is never baselined onto an existing database. A
# pre-existing pharmacy schema is a problem to investigate, not to adopt.
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Supplier invoices for OCR. 10 MB is generous for a photographed invoice.
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_SIZE:10MB}

# Omit nulls from responses. A field that is null is absent, not
# "field": null - which is what makes cost_price genuinely absent for a
# CASHIER rather than present-and-null, per MDD 4.3.
spring.jackson.default-property-inclusion=non_null
# NOTE: no serialization.write-dates-as-timestamps setting. Jackson 3
# (tools.jackson, shipped with Boot 4) moved that flag out of
# SerializationFeature into DateTimeFeature, so the Jackson 2 key below
# fails startup with "No enum constant ... write-dates-as-timestamps".
# Jackson 3 already defaults to ISO-8601, which is what the API contract
# requires, so the default is the correct behaviour and nothing is set.
# Timestamps appear as "2026-09-26T10:14:32Z".

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Must be at least 32 bytes for HS256. JwtService refuses to start otherwise.
# The dev default is deliberately obvious so it is never mistaken for a
# real secret. Override JWT_SECRET in every non-local environment.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-any-real-deployment}
app.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:15}
app.jwt.refresh-token-days=${JWT_REFRESH_DAYS:7}

# A Secure cookie is dropped by the browser over plain HTTP, so with this
# hardcoded true the refresh path silently fails on http://localhost:5163 and
# presents as "silent re-auth is broken". Env-gated: the default is secure,
# and application-dev.properties is the only place it is relaxed.
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:Strict}
# Scoped so the browser never attaches the refresh token to catalogue or
# inventory calls. Only /auth/refresh and /auth/logout need it.
app.cookie.path=${COOKIE_PATH:/api/v1/auth}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5163}

# IdentitySeeder creates the four dev users (one per role) when this is true.
# Default is FALSE, deliberately: the seeder is the only thing standing
# between a published password and a deployed database, so a missing
# environment variable must fail closed, not open. application-dev.properties
# is the only place it is turned on. See progress-tracker.md decision 20.
app.seed.enabled=${SEED_ENABLED:false}

app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.max-size-bytes=${UPLOAD_MAX_BYTES:10485760}

# mock returns fixture prescriptions from MockHmsClient. live activates the
# real Feign client. No calling code changes between the two.
app.hms.mode=${HMS_MODE:mock}
app.hms.api-url=${HMS_API_URL:http://localhost:8080}
app.hms.connect-timeout-ms=${HMS_CONNECT_TIMEOUT:3000}
app.hms.read-timeout-ms=${HMS_READ_TIMEOUT:5000}

# The stock write-off. Default FALSE, and this is the one place a wrong
# default is destructive rather than merely inconvenient: the sweep moves
# real quantities to zero and writes a ledger row that cannot be undone.
# Nothing enables this in the dev profile either - enabling it there would
# mean a developer's machine silently expires whatever is in the shared
# database. Production opts in deliberately, per environment.
app.jobs.expiry-sweep.enabled=${EXPIRY_SWEEP_ENABLED:false}
# 02:15, not midnight. Every scheduled job on the planet fires at 00:00;
# a handful of stock rows has no business competing for the database.
app.jobs.expiry-sweep.cron=${EXPIRY_SWEEP_CRON:0 15 2 * * *}

logging.level.root=INFO
logging.level.com.greedit.pharmacy=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=WARN
# Flyway is quiet by default; WARN surfaces a failed migration without
# burying it in INFO noise.
logging.level.org.flywaydb=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
