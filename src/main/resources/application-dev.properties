# Development profile
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# This is the only profile. MySQL support was removed in decision 22, so the
# datasource and flyway locations in application.properties apply everywhere and
# there is nothing engine-specific left to select. The profile remains because it
# is where developer-only settings belong: SQL echo, DEBUG logging, and a
# non-Secure auth cookie for plain-HTTP localhost.
#
# It is not a security posture. Credentials come from the environment in every
# environment, dev defaults included - see the JWT secret note in
# application.properties.

spring.jpa.show-sql=${JPA_SHOW_SQL:true}
# Keep the session in UTC so LocalDateTime values are written and read
# consistently regardless of the machine's zone. Without this, the same
# expiry timestamp means different instants on different developer
# machines. See MDD.md 3.9.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Plain-HTTP localhost only. A Secure cookie is dropped by the browser over
# plain HTTP, which would silently break refresh in local development.
# Production leaves this at the secure default in the base config.
app.cookie.secure=false

# The only place this is true. A fresh local database gets one user per role
# so the app is usable immediately; a deployed database never will.
app.seed.enabled=true

logging.level.com.greedit.pharmacy=DEBUG
